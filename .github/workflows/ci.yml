name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      front: ${{ steps.filter.outputs.front }}
      back: ${{ steps.filter.outputs.back }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            front:
              - 'front/**'
              - '.github/workflows/ci.yml'
            back:
              - 'back/**'
              - '.github/workflows/ci.yml'

  back:
    needs: changes
    if: needs.changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: komi
          POSTGRES_PASSWORD: komi
          POSTGRES_DB: komi_folio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U komi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://komi:komi@localhost:5432/komi_folio
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      PUBLIC_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
      # Vérifie que les migrations et le seed passent sur une base vide
      - run: npx prisma migrate deploy
      - run: node dist/scripts/seed.js
      - name: Smoke test de l'API
        run: |
          node dist/server.js &
          for i in $(seq 1 20); do curl -sf localhost:4000/health && break; sleep 1; done
          curl -sf localhost:4000/api/portfolio > /dev/null
          curl -sf localhost:4000/api/posts > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/api/admin/stats)" = "401"

  front:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    env:
      # Sans API joignable, le build sert des listes vides (le contenu réel est revalidé en production)
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: https://komi.invity.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
